# ---------------------------------------------------------------------------
# Development overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   (or simply: pnpm docker:up)
#
# Adds: published database ports, hot-reloading builds, and the local stand-ins
# for third-party services — MinIO for S3, Mailpit for SMTP, Adminer for SQL.
# The point is that a new developer needs no cloud account to run the whole
# platform end to end.
# ---------------------------------------------------------------------------

services:
  postgres:
    # Host port is configurable because 5432 is very often already taken by
    # another project's PostgreSQL. The container port is always 5432.
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'

  mysql:
    ports:
      - '${MYSQL_HOST_PORT:-3307}:3306'

  redis:
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.dev.Dockerfile
    image: retailos/api:dev
    command: ['pnpm', 'dev']
    environment:
      NODE_ENV: development
      LOG_PRETTY: 'true'
      STORAGE_DRIVER: s3
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_HOST_PORT:-9100}
      MAIL_DRIVER: smtp
    ports:
      - '${API_PORT:-4000}:4000'
    volumes:
      # Bind-mount the source for hot reload, but keep the container's own
      # node_modules — the host's are built for a different platform.
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - ./database/tenant/migrations:/app/database/tenant/migrations
      - api-node-modules:/app/node_modules
      - api-app-node-modules:/app/apps/api/node_modules
    depends_on:
      minio: { condition: service_healthy }
      mailpit: { condition: service_started }

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.dev.Dockerfile
    image: retailos/api:dev
    command: ['pnpm', 'dev:worker']
    environment:
      NODE_ENV: development
      LOG_PRETTY: 'true'
      MAIL_DRIVER: smtp
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
      - ./database/tenant/migrations:/app/database/tenant/migrations
      - worker-node-modules:/app/node_modules
      - worker-app-node-modules:/app/apps/api/node_modules

  storefront-web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.dev.Dockerfile
      args:
        APP_NAME: storefront-web
        APP_PORT: '3000'
    image: retailos/storefront-web:dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
    ports:
      - '${STOREFRONT_PORT:-3000}:3000'
    volumes:
      - ./apps/storefront-web/src:/app/apps/storefront-web/src
      - ./apps/storefront-web/public:/app/apps/storefront-web/public
      - ./packages:/app/packages
      - storefront-node-modules:/app/node_modules
      - storefront-app-node-modules:/app/apps/storefront-web/node_modules
      - storefront-next:/app/apps/storefront-web/.next

  merchant-web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.dev.Dockerfile
      args:
        APP_NAME: merchant-web
        APP_PORT: '3001'
    image: retailos/merchant-web:dev
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://admin.localhost/api/v1
    ports:
      - '${MERCHANT_PORT:-3001}:3001'
    volumes:
      - ./apps/merchant-web/src:/app/apps/merchant-web/src
      - ./apps/merchant-web/public:/app/apps/merchant-web/public
      - ./packages:/app/packages
      - merchant-node-modules:/app/node_modules
      - merchant-app-node-modules:/app/apps/merchant-web/node_modules
      - merchant-next:/app/apps/merchant-web/.next

  nginx:
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'

  # ======================================================= dev-only services ==

  # S3-compatible object storage. Lets the storage abstraction run its real S3
  # code path locally instead of a filesystem shim that hides bugs.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: retailos-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-retailos}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-retailos_dev_password}
    ports:
      - '${MINIO_HOST_PORT:-9100}:9000'
      - '${MINIO_CONSOLE_HOST_PORT:-9101}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [retailos]

  # Creates the media bucket and makes it publicly readable, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: retailos-minio-init
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-retailos} ${S3_SECRET_KEY:-retailos_dev_password} &&
      mc mb --ignore-existing local/${S3_BUCKET:-retailos-media} &&
      mc anonymous set download local/${S3_BUCKET:-retailos-media} &&
      echo 'MinIO bucket ready'
      "
    networks: [retailos]
    restart: 'no'

  # Catches every outbound email. Open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: retailos-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025'
      - '8025:8025'
    networks: [retailos]

  # Browse the master database and any tenant database. http://localhost:8080
  adminer:
    image: adminer:4.8.1-standalone
    container_name: retailos-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - '${ADMINER_HOST_PORT:-8082}:8080'
    depends_on:
      postgres: { condition: service_healthy }
    networks: [retailos]

  # Inspect queues, jobs and failures. http://localhost:8081
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: retailos-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - '${REDIS_COMMANDER_HOST_PORT:-8083}:8081'
    depends_on:
      redis: { condition: service_healthy }
    networks: [retailos]

volumes:
  api-node-modules:
  api-app-node-modules:
  worker-node-modules:
  worker-app-node-modules:
  storefront-node-modules:
  storefront-app-node-modules:
  storefront-next:
  merchant-node-modules:
  merchant-app-node-modules:
  merchant-next:
