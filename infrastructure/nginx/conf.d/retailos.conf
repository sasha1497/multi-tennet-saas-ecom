# ---------------------------------------------------------------------------
# RetailOS routing.
#
# This file is where multi-tenancy becomes real in a browser:
#
#   kickzone.localhost           -> storefront-web  (tenant from Host)
#   kickzone.localhost/api/v1/*  -> api             (tenant from Host)
#   admin.localhost              -> merchant-web
#   admin.localhost/api/v1/*     -> api             (tenant from the JWT)
#   api.localhost/*              -> api             (docs, webhooks, tooling)
#
# Serving the API under the *tenant's own hostname* is a deliberate choice: the
# storefront's API calls are then same-origin (no CORS preflight on every
# request) and the tenant is carried by the Host header the browser sets itself,
# which a client cannot forge into another tenant without also having a row in
# the `domains` table.
# ---------------------------------------------------------------------------

upstream retailos_api {
    server api:4000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

upstream retailos_storefront {
    server storefront-web:3000 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

upstream retailos_merchant {
    server merchant-web:3001 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

# Shared API location block, included by each server below.
# (nginx has no "include a location", so the body is repeated deliberately
#  rather than hidden behind a map — explicit beats clever in routing config.)

server {
    listen 80 default_server;
    server_name _;

    # Container healthcheck target.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # An unknown hostname is not an error worth a stack trace — most likely a
    # scanner, or a tenant subdomain that was never provisioned.
    location / {
        return 404 'No store is configured at this address.';
        add_header Content-Type text/plain;
    }
}

# ------------------------------------------------------------- API domain --
server {
    listen 80;
    server_name api.localhost api.*;

    limit_conn conn_per_ip 30;

    location = /nginx-health {
        access_log off;
        return 200 'ok';
    }

    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://retailos_api;
    }

    # Webhooks must not be rate limited into failure: a gateway that gets 429s
    # will retry with backoff and delay every order confirmation behind it.
    location /api/v1/webhooks/ {
        proxy_pass http://retailos_api;
    }

    location / {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://retailos_api;
    }
}

# -------------------------------------------------------- Merchant console --
server {
    listen 80;
    server_name admin.localhost admin.*;

    limit_conn conn_per_ip 40;

    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://retailos_api;
    }

    location /api/ {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://retailos_api;
    }

    # Next.js build assets are content-hashed and safe to cache hard.
    location /_next/static/ {
        proxy_pass http://retailos_merchant;
        proxy_cache_valid 200 1y;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location / {
        proxy_pass http://retailos_merchant;
    }
}

# ----------------------------------------------------- Tenant storefronts --
# The wildcard server block. Every merchant subdomain lands here; which store it
# is gets decided by the API from the Host header, not by nginx.
server {
    listen 80;
    server_name ~^(?<tenant>[a-z0-9][a-z0-9-]*)\.localhost$ ~^(?<tenant2>[a-z0-9][a-z0-9-]*)\.(?!localhost$).+$;

    limit_conn conn_per_ip 40;

    # Security headers for the customer-facing surface.
    add_header X-Content-Type-Options    'nosniff'          always;
    add_header X-Frame-Options           'SAMEORIGIN'       always;
    add_header Referrer-Policy           'strict-origin-when-cross-origin' always;
    add_header Permissions-Policy        'camera=(), microphone=(), geolocation=(self)' always;

    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://retailos_api;
    }

    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://retailos_api;
    }

    location /_next/static/ {
        proxy_pass http://retailos_storefront;
        proxy_cache_valid 200 1y;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location / {
        proxy_pass http://retailos_storefront;
    }
}
