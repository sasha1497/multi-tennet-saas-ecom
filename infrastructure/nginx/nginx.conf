user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Include the resolved tenant in the access log — invaluable when debugging
    # "it works on my store but not theirs".
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" host="$host" rid="$http_x_request_id" '
                      'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Merchants upload product photos; the API enforces its own 5 MB limit, this
    # is the outer bound.
    client_max_body_size 12m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    # Do not advertise the version to every scanner on the internet.
    server_tokens off;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml;

    # Rate limiting at the edge, keyed by IP. The API applies its own
    # tenant-aware limits; this is the crude first line that keeps a flood from
    # reaching Node at all.
    limit_req_zone  $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=api_auth:10m    rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    # The Host header is how the API identifies the tenant — passing it through
    # untouched is load-bearing, not cosmetic.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
